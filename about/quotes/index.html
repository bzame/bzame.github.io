<button type=button class=chip data-theme-choice=sepia aria-pressed=false>Sepia</button></div></header><main id=main class=page><article class=prose><h1>Quotes</h1><p class=lead-muted>Lines I've read or heard and wanted to keep close.</p><div class=quote-list><figure class=quote lang=it><blockquote class="quote-text quote-short"><p>Il suo valore sta nell’amore per la cultura: […] non serve per difendere il nostro Paese ma fa sì che valga la pena difendere il nostro Paese</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>La scienza deve essere difesa non solo per i suoi aspetti pratici, ma anche per il suo valore culturale. Dovremmo avere il coraggio di prendere esempio da Robert Wilson, che nel 1969, di fronte a un senatore americano che insistentemente chiedeva quali fossero le applicazioni della costruzione dell’acceleratore al Fermilab, vicino a Chicago, in particolare se fosse utile militarmente per difendere il Paese, rispose: «Il suo valore sta nell’amore per la cultura: è come la pittura, la scultura, la poesia, come tutte quelle attività di cui gli americani sono patriotticamente fieri; non serve per difendere il nostro Paese ma fa sì che valga la pena difendere il nostro Paese».</p></blockquote></details><figcaption class=quote-meta lang=en><span class=quote-said-by>Robert Wilson, quoted in </span><cite>In un volo di storni</cite>, Giorgio Parisi
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><blockquote class=quote-text><p>«Perché l’oggetto del lavoro, credo, non è disposto ad aspettare il comodo del lavoratore, ma è necessario che il lavoratore segua il proprio lavoro non come un’occupazione accessoria».</p></blockquote><figcaption class=quote-meta lang=en><cite>Repubblica</cite>, Platone
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><blockquote class=quote-text><p>«Ma è anche chiaro, credo, che se uno lascia passare il momento opportuno per fare una cosa, questa va in malora».</p></blockquote><figcaption class=quote-meta lang=en><cite>Repubblica</cite>, Platone
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><blockquote class=quote-text><p>Non è tanto importante suonare bene, quanto sentire quello che stai suonando.</p></blockquote><figcaption class=quote-meta lang=en><cite>Il curioso caso di Benjamin Button</cite>, David Fincher (dir.), Francis Scott Fitzgerald (story)
<span class=quote-kind>Film</span></figcaption></figure><figure class=quote lang=it><blockquote class=quote-text><p>Uno si può anche incazzare quando le cose vanno così, uno può bestemmiare, maledire il destino ma quando arrivi alla fine, non resta che mollare.</p></blockquote><figcaption class=quote-meta lang=en><cite>Il curioso caso di Benjamin Button</cite>, David Fincher (dir.), Francis Scott Fitzgerald (story)
<span class=quote-kind>Film</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>It is not the answer that enlightens, but the question.</p></blockquote><figcaption class=quote-meta lang=en><cite>Découvertes</cite>, Eugène Ionesco
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><blockquote class=quote-text><p>All'inferno non si va per accendere una sigaretta.</p></blockquote><figcaption class=quote-meta lang=en><cite>Proverbio greco-cipriota</cite>
<span class=quote-kind>Proverb</span></figcaption></figure><figure class=quote lang=it><blockquote class="quote-text quote-short"><p>"E il mare concederà a ogni uomo nuove speranze, come il sonno porta i sogni"</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>C’è una frase attribuita a Cristoforo Colombo - un personaggio che amo ricordare anche perché la sua casa a Genova è a circa 3 minuti a piedi dalla mia - che recita: "E il mare concederà a ogni uomo nuove speranze, come il sonno porta i sogni".</p></blockquote></details><figcaption class=quote-meta lang=en><span class=quote-said-by>Cristoforo Colombo (attributed), quoted in </span><cite>Il matematico curioso</cite>, Giovanni Filocamo
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>Clustering is used in learning motifs […]. The analogy is that if the amino acids are letters and proteins are sentences, motifs are like words, namely, a string of letters with a particular meaning occurring frequently in different sentences.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>Clustering is used in learning motifs, which are sequences of amino acids that occur repeatedly in proteins. Motifs are of interest because they may correspond to structural or functional elements within the sequences they characterize. The analogy is that if the amino acids are letters and proteins are sentences, motifs are like words, namely, a string of letters with a particular meaning occurring frequently in different sentences.</p></blockquote></details><figcaption class=quote-meta lang=en><cite>Machine Learning: The New AI</cite>, Ethem Alpaydin
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><blockquote class="quote-text quote-short"><p>[…] dai torchi di Manuzio esce quello che da molti è considerato il più bel libro mai stampato, l’Hypnerotomachia Poliphili, […] lasciva e pagana, pur essendo scritta da un frate domenicano […]</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>C’è di più, in ogni caso: dai torchi di Manuzio esce quello che da molti è considerato il più bel libro mai stampato, l’Hypnerotomachia Poliphili, un’opera per molti versi ancor oggi misteriosa; lasciva e pagana, pur essendo scritta da un frate domenicano, con raffigurazioni erotiche, talvolta quasi pornografiche (infatti l’edizione conservata nella Biblioteca vaticana è accuratamente censurata).</p></blockquote></details><figcaption class=quote-meta lang=en><cite>L'alba dei libri. Quando Venezia ha fatto leggere il mondo</cite>, Alessandro Marzo Magno
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><blockquote class=quote-text><p>Il lotto e i giochi basati sulla fortuna sono una “tassa sugli imbecilli”.</p></blockquote><figcaption class=quote-meta lang=en><cite>Web</cite>, Bruno De Finetti
<span class=quote-kind>Web</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>I consider that a man's brain originally is like a little empty attic […]. It is of the highest importance, therefore, not to have useless facts elbowing out the useful ones.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>“You see,” he explained, “I consider that a man's brain originally is like a little empty attic, and you have to stock it with such furniture as you choose. A fool takes in all the lumber of every sort that he comes across, so that the knowledge which might be useful to him gets crowded out, or at best is jumbled up with a lot of other things so that he has a difficulty in laying his hands upon it. Now the skilful workman is very careful indeed as to what he takes into his brain-attic. He will have nothing but the tools which may help him in doing his work, but of these he has a large assortment, and all in the most perfect order. It is a mistake to think that that little room has elastic walls and can distend to any extent. Depend upon it there comes a time when for every addition of knowledge you forget something that you knew before. It is of the highest importance, therefore, not to have useless facts elbowing out the useful ones.”</p></blockquote></details><figcaption class=quote-meta lang=en><cite>A Study in Scarlet</cite>, Sir Arthur Conan Doyle
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><p class=quote-heading>La lingua segreta dei consulenti della comunicazione</p><blockquote class="quote-text quote-short"><p>C’è un momento preciso in cui ci si rende conto di non parlare più come persone normali. […] "Durante un’operazione di ‘beverage management’ nella ‘kitchen area’, ho notato un ‘cluster’ di birre in prossimità del ‘water dispenser’".</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>C’è un momento preciso in cui ci si rende conto di non parlare più come persone normali. Succede quando a fine giornata riponi nel frigo un po’ di lattine di birra e in automatico la tua mente descrive così la situazione: "Durante un’operazione di ‘beverage management’ nella ‘kitchen area’, ho notato un ‘cluster’ di birre in prossimità del ‘water dispenser’".</p></blockquote></details><figcaption class=quote-meta lang=en><cite>Il Post, Sabato 15 marzo 2025</cite>, Ilaria Padovan
<span class=quote-kind>Newspaper</span></figcaption></figure><figure class=quote lang=it><blockquote class="quote-text quote-short"><p>Proprio quando la libertà è ormai percepita da noi come un’abitudine e non più come il più sacro dei beni, emerge dalle tenebre del mondo istintuale una misteriosa volontà di violentarla</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>La dedica di un esemplare di Castellio contro Calvino a un tedesco del Reich sarebbe stata, inoltre, oltremodo compromettente anche dal punto di vista politico, visto che nelle ultime pagine il riferimento della vicenda alla situazione presente nella Germania dominata dal nazismo è fin troppo palese: «Nella rivoluzione francese l’individuo ha finalmente il diritto di professare liberamente e senza discriminazioni la propria fede e la propria opinione, e nel secolo successivo, il diciannovesimo, l’idea di libertà – libertà dei popoli, degli uomini, di pensiero – domina come principio inalienabile l’intero mondo civilizzato. Per tutto un secolo, quasi fino alle soglie del nostro tempo, questa idea di libertà regna con assoluta naturalezza sull’Europa. I diritti dell’uomo sono incardinati nelle fondamenta di ogni stato come l’elemento più inviolabile e irrevocabile di ogni costituzione, e già credevamo tramontati per sempre i tempi dei dispotismi ideologici, delle visioni del mondo imposte, dei diktat di pensiero e delle censure di opinione, e garantito il diritto di ogni individuo all’indipendenza del proprio spirito quanto il diritto al proprio corpo mortale. Ma la storia è flusso e riflusso, un eterno su e giù […] Proprio quando la libertà è ormai percepita da noi come un’abitudine e non più come il più sacro dei beni, emerge dalle tenebre del mondo istintuale una misteriosa volontà di violentarla». La cautela verso il mondo esterno era consigliabile soprattutto nell’interesse degli amici, e la propria agitazione interiore, che aveva ispirato queste frasi, doveva lentamente placarsi.</p></blockquote></details><figcaption class=quote-meta lang=en><cite>Magellano</cite>, Stefan Zweig
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><blockquote class=quote-text><p>Il consiglio che posso dare ai giovani è: nel vostro lavoro, qualunque esso sia, puntate all'eccellenza</p></blockquote><figcaption class=quote-meta lang=en><cite>Web</cite>, Piero Angela
<span class=quote-kind>Web</span></figcaption></figure><figure class=quote lang=vec><blockquote class=quote-text><p>La vita par che la sia longa, ma la dura come ea spuma de na onda</p></blockquote><figcaption class=quote-meta lang=en><cite>Il piede destro di Byron</cite>, Alberto Toso Fei
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><p class=quote-heading>Rasoio di Hitchens</p><blockquote class=quote-text><p>Ciò che si afferma senza prove può esser smentito senza prove</p></blockquote><figcaption class=quote-meta lang=en><cite>Dio non è grande</cite>, Christopher Hitchens
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><blockquote class=quote-text><p>Io non odio persona alcuna, ma vi son uomini ch'io ho bisogno di vedere soltanto da lontano</p></blockquote><figcaption class=quote-meta lang=en><cite>Ultime lettere di Jacopo Ortis</cite>, Ugo Foscolo
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=it><blockquote class="quote-text quote-short"><p>Nessuno scienziato oserebbe ammettere la sua ignoranza nei confronti dei grandi classici […]. Mentre un letterato può dire, senza vergognarsi, di non capire nulla di scienza. Solo chi riesce a navigare in entrambi i mondi può contribuire a scrivere il futuro […].</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>Nessuno scienziato oserebbe ammettere la sua ignoranza nei confronti dei grandi classici della letteratura, si sentirebbe menomato, incolto. Mentre un letterato può dire, senza vergognarsi, di non capire nulla di scienza. Solo chi riesce a navigare in entrambi i mondi può contribuire a scrivere il futuro con intelligenza, responsabilità e creatività.</p></blockquote></details><figcaption class=quote-meta lang=en><cite>Chiedetevi sempre perché</cite>, Piero Angela
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>The ability to speak does not make you intelligent.</p></blockquote><figcaption class=quote-meta lang=en><cite>Star Wars: Episode I – The Phantom Menace</cite>, George Lucas (dir.)
<span class=quote-kind>Film</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>‘So do I,’ said Gandalf, ‘and so do all who live to see such times. But that is not for them to decide. All we have to decide is what to do with the time that is given us.’</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>‘I wish it need not have happened in my time,’ said Frodo.
‘So do I,’ said Gandalf, ‘and so do all who live to see such times. But that is not for them to decide. All we have to decide is what to do with the time that is given us.’</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Fellowship of the Ring</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>I will not say: do not weep; for not all tears are an evil.</p></blockquote><figcaption class=quote-meta lang=en><cite>The Return of the King</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>I am glad you are here with me. Here at the end of all things, Sam.</p></blockquote><figcaption class=quote-meta lang=en><cite>The Return of the King</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>Many that live deserve death. And some that die deserve life. Can you give it to them? Then do not be too eager to deal out death in judgement. For even the very wise cannot see all ends.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>‘But this is terrible!’ cried Frodo. ‘Far worse than the worst that I imagined from your hints and warnings. O Gandalf, best of friends, what am I to do? For now I am really afraid. What am I to do? What a pity that Bilbo did not stab that vile creature, when he had a chance!’
‘Pity? It was Pity that stayed his hand. Pity, and Mercy: not to strike without need. And he has been well rewarded, Frodo. Be sure that he took so little hurt from the evil, and escaped in the end, because he began his ownership of the Ring so. With Pity.’
‘I am sorry,’ said Frodo. ‘But I am frightened; and I do not feel any pity for Gollum.’
‘You have not seen him,’ Gandalf broke in.
‘No, and I don’t want to,’ said Frodo. ‘I can’t understand you. Do you mean to say that you, and the Elves, have let him live on after all those horrible deeds? Now at any rate he is as bad as an Orc, and just an enemy. He deserves death.’
‘Deserves it! I daresay he does. Many that live deserve death. And some that die deserve life. Can you give it to them? Then do not be too eager to deal out death in judgement. For even the very wise cannot see all ends. I have not much hope that Gollum can be cured before he dies, but there is a chance of it. And he is bound up with the fate of the Ring. My heart tells me that he has some part to play yet, for good or ill, before the end; and when that comes, the pity of Bilbo may rule the fate of many – yours not least.’</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Fellowship of the Ring</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>He that breaks a thing to find out what it is has left the path of wisdom.</p></blockquote><figcaption class=quote-meta lang=en><cite>The Fellowship of the Ring</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>It is not despair, for despair is only for those who see the end beyond all doubt. We do not.</p></blockquote><figcaption class=quote-meta lang=en><cite>The Fellowship of the Ring</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>[…] Do you wish me a good morning, or mean that it is a good morning whether I want it or not; or that you feel good this morning; or that it is a morning to be good on?</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>“Good Morning!” said Bilbo, and he meant it. The sun was shining, and the grass was very green. But Gandalf looked at him from under long bushy eyebrows that stuck out further than the brim of his shady hat.
“What do you mean?” he said. “Do you wish me a good morning, or mean that it is a good morning whether I want it or not; or that you feel good this morning; or that it is a morning to be good on?”
“All of them at once,” said Bilbo. “And a very fine morning for a pipe of tobacco out of doors, into the bargain. […]
“Good morning!” he said at last. “We don’t want any adventures here, thank you! You might try over The Hill or across The Water.” By this he meant that the conversation was at an end.
“What a lot of things you do use Good morning for!” said Gandalf. “Now you mean that you want to get rid of me, and that it won’t be good till I move off.”</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Hobbit</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>Where now are the horse and the rider? […]
They have passed like rain on the mountain, like a wind in the meadow;
The days have gone down in the West behind the hills into shadow.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>Where now are the horse and the rider? Where is the horn that was blowing?
Where is the helm and the hauberk, and the bright hair flowing?
Where is the harp on the harpstring, and the red fire glowing?
Where is the spring and the harvest and the tall corn growing?
They have passed like rain on the mountain, like a wind in the meadow;
The days have gone down in the West behind the hills into shadow.
Who shall gather the smoke of the deadwood burning,
Or behold the flowing years from the Sea returning?</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Two Towers</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>Fly, you fools!</p></blockquote><figcaption class=quote-meta lang=en><cite>The Fellowship of the Ring</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>Folk in those stories had lots of chances of turning back only they didn't. They kept going. Because they were holding on to something. […] That there's some good in this world, Mr. Frodo... and it's worth fighting for.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>Frodo: I can't do this, Sam.
Sam: I know. It's all wrong. By rights we shouldn't even be here. But we are. It's like in the great stories, Mr. Frodo. The ones that really mattered. Full of darkness, and danger, they were. And sometimes you didn't want to know the end, because how could the end be happy? How could the world go back to the way it was when so much bad had happened? But in the end, it's only a passing thing, this shadow. Even darkness must pass. A new day will come. And when the sun shines, it'll shine out the clearer. Those were the stories that stayed with you. That meant something. Even if you were too small to understand why. But I think, Mr. Frodo, I do understand. I know now. Folk in those stories had lots of chances of turning back only they didn't. They kept going. Because they were holding on to something.
Frodo: What are we holding on to, Sam?
Sam: That there's some good in this world, Mr. Frodo... and it's worth fighting for.</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Lord of the Rings: The Two Towers</cite>, Peter Jackson (dir.), J.R.R. Tolkien (novel)
<span class=quote-kind>Film</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>“Fool of a Took!” he growled. “This is a serious journey, not a hobbit walking-party. Throw yourself in next time, and then you will be no further nuisance.”</p></blockquote><figcaption class=quote-meta lang=en><cite>The Fellowship of the Ring</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>Courage will now be your best defence against the storm that is at hand—that and such hope as I bring.</p></blockquote><figcaption class=quote-meta lang=en><cite>The Return of the King</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>Sam: I wonder if people will ever say, 'Let's hear about Frodo and the Ring.' […]
Frodo: You've left out one of the chief characters - Samwise the Brave. I want to hear more about Sam. Frodo wouldn't have got far without Sam.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>Sam: I wonder if we'll ever be put into songs or tales.
Frodo: What?
Sam: I wonder if people will ever say, 'Let's hear about Frodo and the Ring.' And they'll say 'Yes, that's one of my favorite stories. Frodo was really courageous, wasn't he, Dad?' 'Yes, my boy, the most famousest of hobbits. And that's saying a lot.'
Frodo: You've left out one of the chief characters - Samwise the Brave. I want to hear more about Sam. Frodo wouldn't have got far without Sam.
Sam: Now Mr. Frodo, you shouldn't make fun; I was being serious.
Frodo: So was I.
Sam: Samwise the Brave...</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Lord of the Rings: The Two Towers</cite>, Peter Jackson (dir.), J.R.R. Tolkien (novel)
<span class=quote-kind>Film</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>Books ought to have good endings. How would this do: and they all settled down and lived together happily ever after? […] It will do well, if it ever came to that.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>“Have you thought of an ending?”
“Yes, several, and all are dark and unpleasant.”
“Oh, that won't do! Books ought to have good endings. How would this do: and they all settled down and lived together happily ever after?”
“It will do well, if it ever came to that.”
“Ah! And where will they live? That's what I often wonder.”</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Fellowship of the Ring</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>It is a lovely language, but it takes a very long time to say anything in it, because we do not say anything in it, unless it is worth taking a long time to say, and to listen to.</p></blockquote><figcaption class=quote-meta lang=en><cite>The Two Towers</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>But I spoke hastily. We must not be hasty. I have become too hot. I must cool myself and think; for it is easier to shout stop! than to do it.</p></blockquote><figcaption class=quote-meta lang=en><cite>The Two Towers</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>Let this be the hour when we draw swords together. Fell deeds awake. Now for wrath, now for ruin, and the red dawn. Forth, Eorlingas!</p></blockquote><figcaption class=quote-meta lang=en><cite>The Lord of the Rings: The Two Towers</cite>, Peter Jackson (dir.), J.R.R. Tolkien (novel)
<span class=quote-kind>Film</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>In this phial […] is caught the light of Eärendil’s star, set amid the waters of my fountain. […] May it be a light to you in dark places, when all other lights go out.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>‘And you, Ring-bearer,’ she said, turning to Frodo. ‘I come to you last who are not last in my thoughts. For you I have prepared this.’ She held up a small crystal phial: it glittered as she moved it, and rays of white light sprang from her hand. ‘In this phial,’ she said, ‘is caught the light of Eärendil’s star, set amid the waters of my fountain. It will shine still brighter when night is about you. May it be a light to you in dark places, when all other lights go out. Remember Galadriel and her Mirror!’
Frodo took the phial, and for a moment as it shone between them, he saw her again standing like a queen, great and beautiful.</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Fellowship of the Ring</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>End? No, the journey doesn't end here. Death is just another path, one that we all must take. The grey rain-curtain of this world rolls back, […] and then you see it. White shores, and beyond, a far green country under a swift sunrise.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>End? No, the journey doesn't end here. Death is just another path, one that we all must take. The grey rain-curtain of this world rolls back, and all turns to silver glass, and then you see it. White shores, and beyond, a far green country under a swift sunrise.</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Lord of the Rings: The Return of the King</cite>, Peter Jackson (dir.), J.R.R. Tolkien (novel)
<span class=quote-kind>Film</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>The wise speak only of what they know, Gríma son of Gálmód. A witless worm have you become. Therefore be silent, and keep your forked tongue behind your teeth.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>‘The wise speak only of what they know, Gríma son of Gálmód. A witless worm have you become. Therefore be silent, and keep your forked tongue behind your teeth. I have not passed through fire and death to bandy words with a serving-man till the lightning falls.’ There was a roll of thunder. The sunlight became blotted out from the eastern windows; the whole hall became suddenly dark as night. The fire faded to sullen embers. Only Gandalf could be seen, standing white and tall before the blackened hearth.</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Two Towers</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>Never is too long a word, even for me.</p></blockquote><figcaption class=quote-meta lang=en><cite>The Return of the King</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>I feel like spring after winter, and sun on the leaves; and like trumpets and harps and all the songs I have ever heard!</p></blockquote><figcaption class=quote-meta lang=en><cite>The Return of the King</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>'Tell me,' he said, 'is there any hope? […]'
Gandalf put his hand on Pippin's head. 'There never was much hope,' he answered. 'Just a fool's hope, as I have been told.'</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>All now took leave of the Lord of the City and went to rest while they still could. Outside there was a starless blackness as Gandalf, with Pippin beside him bearing a small torch, made his way to their lodging. They did not speak until they were behind closed doors. Then at last Pippin took Gandalf's hand.
'Tell me,' he said, 'is there any hope? For Frodo, I mean; or at least mostly for Frodo.'
Gandalf put his hand on Pippin's head. 'There never was much hope,' he answered. 'Just a fool's hope, as I have been told. And when I heard of Cirith Ungol—' He broke off and strode to the window, as if his eyes could pierce the night in the East. 'Cirith Ungol!' he muttered. 'Why that way, I wonder?' He turned. 'Just now, Pippin, my heart almost failed me, hearing that name. And yet in truth I believe that the news that Faramir brings has some hope in it. For it seems clear that the Enemy has opened his war at last and made the first move when Frodo was still free. So now for many days he will have his eye turned this way and that, away from his own land. And yet, Pippin, I feel from afar his haste and fear. He has begun sooner than he would. Something has happened to stir him.'</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Return of the King</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>The world is changing: I feel it in the water, I feel it in the earth, and I smell it in the air.</p></blockquote><figcaption class=quote-meta lang=en><cite>The Return of the King</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class="quote-text quote-short"><p>“I have it!” he cried. “Of course, of course! Absurdly simple, like most riddles when you see the answer.” […] Mellon!</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>With a suddenness that startled them all the wizard sprang to his feet. He was laughing! “I have it!” he cried. “Of course, of course! Absurdly simple, like most riddles when you see the answer.”
Picking up his staff he stood before the rock and said in a clear voice: Mellon!
The star shone out briefly and faded again. Then silently a great doorway was outlined, though not a crack or joint had been visible before. Slowly it divided in the middle and swung outwards inch by inch, until both doors lay back against the wall.</p></blockquote></details><figcaption class=quote-meta lang=en><cite>The Fellowship of the Ring</cite>, J.R.R. Tolkien
<span class=quote-kind>Book</span></figcaption></figure><figure class=quote lang=en><blockquote class=quote-text><p>It is the deep breath before the plunge.</p></blockquote><figcaption class=quote-meta lang=en><cite>The Return of the King</cite>, J.R.R. Tolkien
