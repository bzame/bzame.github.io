<span class=quote-where>in Giorgio Parisi, <cite>In a Flight of Starlings</cite><span class=quote-kind>Book</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=it aria-pressed=true lang=it>Italiano</button>
<button type=button class=quote-lang data-v=en aria-pressed=false lang=en>English</button></p></figure></div><div class=qotd-item hidden><figure class="quote quote--card" data-author=platone data-kind=book data-lang=it><div class=quote-version lang=it data-v=it><blockquote class=quote-text><p>«Perché l’oggetto del lavoro, credo, non è disposto ad aspettare il comodo del lavoratore, ma è necessario che il lavoratore segua il proprio lavoro non come un’occupazione accessoria».</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Platone</span>
<span class=quote-where><cite>Repubblica</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=en data-v=en hidden><blockquote class=quote-text><p>“Because the work, I believe, is not willing to wait for the worker’s convenience; the worker must attend to his work, and not as a side occupation”.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Platone</span>
<span class=quote-where><cite>Republic</cite><span class=quote-kind>Book</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=it aria-pressed=true lang=it>Italiano</button>
<button type=button class=quote-lang data-v=en aria-pressed=false lang=en>English</button></p></figure></div><div class=qotd-item hidden><figure class="quote quote--card" data-author=platone data-kind=book data-lang=it><div class=quote-version lang=it data-v=it><blockquote class=quote-text><p>«Ma è anche chiaro, credo, che se uno lascia passare il momento opportuno per fare una cosa, questa va in malora».</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Platone</span>
<span class=quote-where><cite>Repubblica</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=en data-v=en hidden><blockquote class=quote-text><p>“But it is also clear, I believe, that if one lets the right moment for doing something pass, the thing is ruined”.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Platone</span>
<span class=quote-where><cite>Republic</cite><span class=quote-kind>Book</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=it aria-pressed=true lang=it>Italiano</button>
<button type=button class=quote-lang data-v=en aria-pressed=false lang=en>English</button></p></figure></div><div class=qotd-item hidden><figure class="quote quote--card" data-author=david-fincher-dir.-francis-scott-fitzgerald-story data-kind=film data-lang=it><div class=quote-version lang=it data-v=it><blockquote class=quote-text><p>Non è tanto importante suonare bene, quanto sentire quello che stai suonando.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— David Fincher (dir.), Francis Scott Fitzgerald (story)</span>

<span class=quote-where><cite>The Curious Case of Benjamin Button</cite><span class=quote-kind>Film</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=it aria-pressed=true lang=it>Italiano</button>

<button type=button class=quote-lang data-v=it aria-pressed=false lang=it>Italiano</button></p></figure></div><div class=qotd-item hidden><figure class="quote quote--card" data-author=peter-jackson-dir.-j.r.r.-tolkien-novel data-kind=film data-lang=en><div class=quote-version lang=en data-v=en><blockquote class=quote-text><p>Let this be the hour when we draw swords together. Fell deeds awake. Now for wrath, now for ruin, and the red dawn. Forth, Eorlingas!</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Théoden</span>

<span class=quote-where>in J.R.R. Tolkien, <cite>The Fellowship of the Ring</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=it data-v=it hidden><blockquote class=quote-text><p>In questa fiala […] è racchiusa la luce della stella di Eärendil, posta tra le acque della mia fonte. […] Possa essere per te una luce nei luoghi oscuri, quando ogni altra luce si spegne.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Galadriel</span>
<span class=quote-where>in J.R.R. Tolkien, <cite>La Compagnia dell'Anello</cite><span class=quote-kind>Book</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=en aria-pressed=true lang=en>English</button>

<button type=button class="chip f-clear" hidden>Clear filters</button><p class=pub-count role=status></p></div><div class=quote-list><figure class=quote data-author=giorgio-parisi data-kind=book data-lang=it><div class=quote-version lang=it data-v=it><blockquote class="quote-text quote-short"><p>Il suo valore sta nell’amore per la cultura: […] non serve per difendere il nostro Paese ma fa sì che valga la pena difendere il nostro Paese</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>La scienza deve essere difesa non solo per i suoi aspetti pratici, ma anche per il suo valore culturale. Dovremmo avere il coraggio di prendere esempio da Robert Wilson, che nel 1969, di fronte a un senatore americano che insistentemente chiedeva quali fossero le applicazioni della costruzione dell’acceleratore al Fermilab, vicino a Chicago, in particolare se fosse utile militarmente per difendere il Paese, rispose: «Il suo valore sta nell’amore per la cultura: è come la pittura, la scultura, la poesia, come tutte quelle attività di cui gli americani sono patriotticamente fieri; non serve per difendere il nostro Paese ma fa sì che valga la pena difendere il nostro Paese».</p></blockquote></details><div class=cap-when-short><figcaption class=quote-meta lang=en><span class=quote-who>— Robert Wilson</span>
<span class=quote-where>in Giorgio Parisi, <cite>In un volo di storni</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=cap-when-full><figcaption class=quote-meta lang=en><span class=quote-who>— Giorgio Parisi</span>
<span class=quote-where><cite>In un volo di storni</cite><span class=quote-kind>Book</span></span></figcaption></div></div><div class=quote-version lang=en data-v=en hidden><blockquote class="quote-text quote-short"><p>Its value lies in the love of culture: […] it does not serve to defend our country, but it makes our country worth defending</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>Science must be defended not only for its practical aspects, but also for its cultural value. We should have the courage to follow the example of Robert Wilson who, in 1969, faced with an American senator who kept asking what the applications of building the accelerator at Fermilab, near Chicago, would be, and in particular whether it would be militarily useful to defend the country, replied: “Its value lies in the love of culture: it is like painting, sculpture, poetry, like all those activities Americans are patriotically proud of; it does not serve to defend our country, but it makes our country worth defending”.</p></blockquote></details><div class=cap-when-short><figcaption class=quote-meta lang=en><span class=quote-who>— Robert Wilson</span>
<span class=quote-where>in Giorgio Parisi, <cite>In a Flight of Starlings</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=cap-when-full><figcaption class=quote-meta lang=en><span class=quote-who>— Giorgio Parisi</span>
<span class=quote-where><cite>In a Flight of Starlings</cite><span class=quote-kind>Book</span></span></figcaption></div></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=it aria-pressed=true lang=it>Italiano</button>
<button type=button class=quote-lang data-v=en aria-pressed=false lang=en>English</button></p></figure><figure class=quote data-author=platone data-kind=book data-lang=it><div class=quote-version lang=it data-v=it><blockquote class=quote-text><p>«Perché l’oggetto del lavoro, credo, non è disposto ad aspettare il comodo del lavoratore, ma è necessario che il lavoratore segua il proprio lavoro non come un’occupazione accessoria».</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Platone</span>
<span class=quote-where><cite>Repubblica</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=en data-v=en hidden><blockquote class=quote-text><p>“Because the work, I believe, is not willing to wait for the worker’s convenience; the worker must attend to his work, and not as a side occupation”.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Platone</span>
<span class=quote-where><cite>Republic</cite><span class=quote-kind>Book</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=it aria-pressed=true lang=it>Italiano</button>
<button type=button class=quote-lang data-v=en aria-pressed=false lang=en>English</button></p></figure><figure class=quote data-author=platone data-kind=book data-lang=it><div class=quote-version lang=it data-v=it><blockquote class=quote-text><p>«Ma è anche chiaro, credo, che se uno lascia passare il momento opportuno per fare una cosa, questa va in malora».</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Platone</span>
<span class=quote-where><cite>Repubblica</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=en data-v=en hidden><blockquote class=quote-text><p>“But it is also clear, I believe, that if one lets the right moment for doing something pass, the thing is ruined”.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Platone</span>
<span class=quote-where><cite>Republic</cite><span class=quote-kind>Book</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=it aria-pressed=true lang=it>Italiano</button>
<button type=button class=quote-lang data-v=en aria-pressed=false lang=en>English</button></p></figure><figure class=quote data-author=david-fincher-dir.-francis-scott-fitzgerald-story data-kind=film data-lang=it><div class=quote-version lang=it data-v=it><blockquote class=quote-text><p>Non è tanto importante suonare bene, quanto sentire quello che stai suonando.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— David Fincher (dir.), Francis Scott Fitzgerald (story)</span>
<span class=quote-where><cite>Il curioso caso di Benjamin Button</cite><span class=quote-kind>Film</span></span></figcaption></div><div class=quote-version lang=en data-v=en hidden><blockquote class=quote-text><p>It’s not about how well you play, it’s how you feel about what you’re playing.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— David Fincher (dir.), Francis Scott Fitzgerald (story)</span>

<button type=button class=quote-lang data-v=en aria-pressed=false lang=en>English</button></p></figure><figure class=quote data-author=sir-arthur-conan-doyle data-kind=book data-lang=en><div class=quote-version lang=en data-v=en><blockquote class="quote-text quote-short"><p>I consider that a man's brain originally is like a little empty attic […]. It is of the highest importance, therefore, not to have useless facts elbowing out the useful ones.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>“You see,” he explained, “I consider that a man's brain originally is like a little empty attic, and you have to stock it with such furniture as you choose. A fool takes in all the lumber of every sort that he comes across, so that the knowledge which might be useful to him gets crowded out, or at best is jumbled up with a lot of other things so that he has a difficulty in laying his hands upon it. Now the skilful workman is very careful indeed as to what he takes into his brain-attic. He will have nothing but the tools which may help him in doing his work, but of these he has a large assortment, and all in the most perfect order. It is a mistake to think that that little room has elastic walls and can distend to any extent. Depend upon it there comes a time when for every addition of knowledge you forget something that you knew before. It is of the highest importance, therefore, not to have useless facts elbowing out the useful ones.”</p></blockquote></details><figcaption class=quote-meta lang=en><span class=quote-who>— Sir Arthur Conan Doyle</span>
<span class=quote-where><cite>A Study in Scarlet</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=it data-v=it hidden><blockquote class="quote-text quote-short"><p>Io ritengo che il cervello di un uomo sia in origine come una piccola soffitta vuota […]. È quindi della massima importanza non lasciare che i fatti inutili scaccino quelli utili.</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>«Vede», spiegò, «io ritengo che il cervello di un uomo sia in origine come una piccola soffitta vuota, da arredare con i mobili che si preferiscono. Lo sciocco vi ammassa ogni sorta di cianfrusaglia in cui si imbatte, così che le conoscenze che potrebbero essergli utili restano soffocate o, nel migliore dei casi, si mescolano a molte altre cose e fa fatica a ritrovarle. L’artigiano abile, invece, sta molto attento a ciò che porta nella soffitta del suo cervello. Non vuole altro che gli attrezzi che possono aiutarlo nel suo lavoro, ma di questi ha un vasto assortimento, e tutti nel più perfetto ordine. È un errore credere che quella stanzetta abbia pareti elastiche e possa dilatarsi a piacere. Stia certo che arriva un momento in cui, per ogni nuova conoscenza, si dimentica qualcosa che si sapeva prima. È quindi della massima importanza non lasciare che i fatti inutili scaccino quelli utili».</p></blockquote></details><figcaption class=quote-meta lang=en><span class=quote-who>— Sir Arthur Conan Doyle</span>

<button type=button class=quote-lang data-v=it aria-pressed=false lang=it>Italiano</button></p></figure><figure class=quote data-author=ilaria-padovan data-kind=newspaper data-lang=it><div class=quote-version lang=it data-v=it><p class=quote-heading>La lingua segreta dei consulenti della comunicazione</p><blockquote class="quote-text quote-short"><p>C’è un momento preciso in cui ci si rende conto di non parlare più come persone normali. […] "Durante un’operazione di ‘beverage management’ nella ‘kitchen area’, ho notato un ‘cluster’ di birre in prossimità del ‘water dispenser’".</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>C’è un momento preciso in cui ci si rende conto di non parlare più come persone normali. Succede quando a fine giornata riponi nel frigo un po’ di lattine di birra e in automatico la tua mente descrive così la situazione: "Durante un’operazione di ‘beverage management’ nella ‘kitchen area’, ho notato un ‘cluster’ di birre in prossimità del ‘water dispenser’".</p></blockquote></details><figcaption class=quote-meta lang=en><span class=quote-who>— Ilaria Padovan</span>

<button type=button class=quote-lang data-v=en aria-pressed=false lang=en>English</button></p></figure><figure class=quote data-author=stefan-zweig data-kind=book data-lang=it><div class=quote-version lang=it data-v=it><blockquote class="quote-text quote-short"><p>Proprio quando la libertà è ormai percepita da noi come un’abitudine e non più come il più sacro dei beni, emerge dalle tenebre del mondo istintuale una misteriosa volontà di violentarla</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>La dedica di un esemplare di Castellio contro Calvino a un tedesco del Reich sarebbe stata, inoltre, oltremodo compromettente anche dal punto di vista politico, visto che nelle ultime pagine il riferimento della vicenda alla situazione presente nella Germania dominata dal nazismo è fin troppo palese: «Nella rivoluzione francese l’individuo ha finalmente il diritto di professare liberamente e senza discriminazioni la propria fede e la propria opinione, e nel secolo successivo, il diciannovesimo, l’idea di libertà – libertà dei popoli, degli uomini, di pensiero – domina come principio inalienabile l’intero mondo civilizzato. Per tutto un secolo, quasi fino alle soglie del nostro tempo, questa idea di libertà regna con assoluta naturalezza sull’Europa. I diritti dell’uomo sono incardinati nelle fondamenta di ogni stato come l’elemento più inviolabile e irrevocabile di ogni costituzione, e già credevamo tramontati per sempre i tempi dei dispotismi ideologici, delle visioni del mondo imposte, dei diktat di pensiero e delle censure di opinione, e garantito il diritto di ogni individuo all’indipendenza del proprio spirito quanto il diritto al proprio corpo mortale. Ma la storia è flusso e riflusso, un eterno su e giù […] Proprio quando la libertà è ormai percepita da noi come un’abitudine e non più come il più sacro dei beni, emerge dalle tenebre del mondo istintuale una misteriosa volontà di violentarla». La cautela verso il mondo esterno era consigliabile soprattutto nell’interesse degli amici, e la propria agitazione interiore, che aveva ispirato queste frasi, doveva lentamente placarsi.</p></blockquote></details><div class=cap-when-short><figcaption class=quote-meta lang=en><span class=quote-who>— Stefan Zweig</span>
<span class=quote-where><cite>Castellio contro Calvino</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=cap-when-full><figcaption class=quote-meta lang=en><span class=quote-who>— Stefan Zweig</span>
<span class=quote-where><cite>Magellano</cite><span class=quote-kind>Book</span></span></figcaption></div></div><div class=quote-version lang=en data-v=en hidden><blockquote class="quote-text quote-short"><p>Just when freedom has become a habit for us and is no longer felt as the most sacred of goods, a mysterious will to violate it rises from the darkness of the world of instinct</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>Moreover, dedicating a copy of Castellio against Calvin to a German of the Reich would have been extremely compromising politically as well, since in the last pages the link between the story and the present situation in Nazi-ruled Germany is all too plain: “In the French Revolution the individual at last has the right to profess his faith and his opinion freely and without discrimination, and in the following century, the nineteenth, the idea of freedom – freedom of peoples, of men, of thought – rules the whole civilized world as an inalienable principle. For a whole century, almost up to the threshold of our own time, this idea of freedom reigns over Europe as a matter of course. The rights of man are set in the foundations of every state as the most inviolable and irrevocable element of every constitution, and we already believed that the times of ideological despotism, of imposed world views, of dictates of thought and censorship of opinion were gone for ever, and the right of every individual to the independence of his own mind as secure as the right to his own mortal body. But history is ebb and flow, an eternal up and down […] Just when freedom has become a habit for us and is no longer felt as the most sacred of goods, a mysterious will to violate it rises from the darkness of the world of instinct”. Caution towards the outside world was advisable above all in the interest of his friends, and the inner agitation that had inspired these sentences had to subside slowly.</p></blockquote></details><div class=cap-when-short><figcaption class=quote-meta lang=en><span class=quote-who>— Stefan Zweig</span>

<span class=quote-where><cite>Magellan</cite><span class=quote-kind>Book</span></span></figcaption></div></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=it aria-pressed=true lang=it>Italiano</button>

‘Pity? It was Pity that stayed his hand. Pity, and Mercy: not to strike without need. And he has been well rewarded, Frodo. Be sure that he took so little hurt from the evil, and escaped in the end, because he began his ownership of the Ring so. With Pity.’
‘I am sorry,’ said Frodo. ‘But I am frightened; and I do not feel any pity for Gollum.’
‘You have not seen him,’ Gandalf broke in.
‘No, and I don’t want to,’ said Frodo. ‘I can’t understand you. Do you mean to say that you, and the Elves, have let him live on after all those horrible deeds? Now at any rate he is as bad as an Orc, and just an enemy. He deserves death.’
‘Deserves it! I daresay he does. Many that live deserve death. And some that die deserve life. Can you give it to them? Then do not be too eager to deal out death in judgement. For even the very wise cannot see all ends. I have not much hope that Gollum can be cured before he dies, but there is a chance of it. And he is bound up with the fate of the Ring. My heart tells me that he has some part to play yet, for good or ill, before the end; and when that comes, the pity of Bilbo may rule the fate of many – yours not least.’</p></blockquote></details><figcaption class=quote-meta lang=en><span class=quote-who>— Gandalf</span>

«Peccato? Fu la Pietà a fermargli la mano. La Pietà, e la Misericordia: non colpire senza necessità. E ne è stato ben ricompensato, Frodo. Sta&rsquo; certo che se il male gli ha nuociuto così poco, e alla fine è riuscito a sfuggirgli, è perché ha cominciato così il suo possesso dell&rsquo;Anello. Con Pietà.»

«Tu non l&rsquo;hai visto», lo interruppe Gandalf.

Sam: I know. It's all wrong. By rights we shouldn't even be here. But we are. It's like in the great stories, Mr. Frodo. The ones that really mattered. Full of darkness, and danger, they were. And sometimes you didn't want to know the end, because how could the end be happy? How could the world go back to the way it was when so much bad had happened? But in the end, it's only a passing thing, this shadow. Even darkness must pass. A new day will come. And when the sun shines, it'll shine out the clearer. Those were the stories that stayed with you. That meant something. Even if you were too small to understand why. But I think, Mr. Frodo, I do understand. I know now. Folk in those stories had lots of chances of turning back only they didn't. They kept going. Because they were holding on to something.

Sam: Lo so. È tutto sbagliato. A rigor di logica non dovremmo neanche essere qui. Ma ci siamo. È come nelle grandi storie, padron Frodo. Quelle che contano davvero. Erano piene di oscurità e di pericoli. E a volte non volevi sapere il finale, perché come poteva finire bene? Come poteva il mondo tornare com&rsquo;era dopo che era successo tanto male? Ma alla fine è solo una cosa passeggera, quest&rsquo;ombra. Anche l&rsquo;oscurità deve passare. Arriverà un nuovo giorno. E quando il sole splenderà, splenderà ancora più luminoso. Quelle erano le storie che ti restavano dentro. Che significavano qualcosa. Anche se eri troppo piccolo per capire perché. Ma credo, padron Frodo, di capire. Ora lo so. La gente di quelle storie aveva tante occasioni per tornare indietro, ma non l&rsquo;ha fatto. È andata avanti. Perché si aggrappava a qualcosa.
Frodo: E noi a cosa ci aggrappiamo, Sam?

<span class=quote-where>in J.R.R. Tolkien, <cite>The Return of the King</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=it data-v=it hidden><blockquote class=quote-text><p>Mai è una parola troppo lunga, persino per me.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Treebeard</span>

<button type=button class=quote-lang data-v=it aria-pressed=false lang=it>Italiano</button></p></figure><figure class=quote data-author=j.r.r.-tolkien data-kind=book data-lang=en><div class=quote-version lang=en data-v=en><blockquote class=quote-text><p>I feel like spring after winter, and sun on the leaves; and like trumpets and harps and all the songs I have ever heard!</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Sam</span>
<span class=quote-where>in J.R.R. Tolkien, <cite>The Return of the King</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=it data-v=it hidden><blockquote class=quote-text><p>Mi sento come la primavera dopo l&rsquo;inverno, e il sole sulle foglie; e come trombe e arpe e tutte le canzoni che io abbia mai sentito!</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Sam</span>
<span class=quote-where>in J.R.R. Tolkien, <cite>Il ritorno del re</cite><span class=quote-kind>Book</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=en aria-pressed=true lang=en>English</button>
<button type=button class=quote-lang data-v=it aria-pressed=false lang=it>Italiano</button></p></figure><figure class=quote data-author=j.r.r.-tolkien data-kind=book data-lang=en><div class=quote-version lang=en data-v=en><blockquote class="quote-text quote-short"><p>'Tell me,' he said, 'is there any hope? […]'
Gandalf put his hand on Pippin's head. 'There never was much hope,' he answered. 'Just a fool's hope, as I have been told.'</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>All now took leave of the Lord of the City and went to rest while they still could. Outside there was a starless blackness as Gandalf, with Pippin beside him bearing a small torch, made his way to their lodging. They did not speak until they were behind closed doors. Then at last Pippin took Gandalf's hand.
'Tell me,' he said, 'is there any hope? For Frodo, I mean; or at least mostly for Frodo.'
Gandalf put his hand on Pippin's head. 'There never was much hope,' he answered. 'Just a fool's hope, as I have been told. And when I heard of Cirith Ungol—' He broke off and strode to the window, as if his eyes could pierce the night in the East. 'Cirith Ungol!' he muttered. 'Why that way, I wonder?' He turned. 'Just now, Pippin, my heart almost failed me, hearing that name. And yet in truth I believe that the news that Faramir brings has some hope in it. For it seems clear that the Enemy has opened his war at last and made the first move when Frodo was still free. So now for many days he will have his eye turned this way and that, away from his own land. And yet, Pippin, I feel from afar his haste and fear. He has begun sooner than he would. Something has happened to stir him.'</p></blockquote></details><figcaption class=quote-meta lang=en><span class=quote-who>— Gandalf</span>
<span class=quote-where>in J.R.R. Tolkien, <cite>The Return of the King</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=it data-v=it hidden><blockquote class="quote-text quote-short"><p>«Dimmi», disse, «c&rsquo;è qualche speranza? […]»
Gandalf posò la mano sul capo di Pipino. «Non c&rsquo;è mai stata molta speranza», rispose. «Solo una speranza da folli, come mi è stato detto.»</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>Tutti allora presero congedo dal Signore della Città e andarono a riposare finché potevano. Fuori c&rsquo;era un buio senza stelle mentre Gandalf, con Pipino accanto che reggeva una piccola torcia, si dirigeva al loro alloggio. Non parlarono finché non furono dietro porte chiuse. Allora finalmente Pipino prese la mano di Gandalf.
«Dimmi», disse, «c&rsquo;è qualche speranza? Per Frodo, intendo; o almeno soprattutto per Frodo.»
Gandalf posò la mano sul capo di Pipino. «Non c&rsquo;è mai stata molta speranza», rispose. «Solo una speranza da folli, come mi è stato detto. E quando ho sentito di Cirith Ungol…» S&rsquo;interruppe e andò alla finestra, come se i suoi occhi potessero trafiggere la notte a Oriente. «Cirith Ungol!» mormorò. «Perché da quella parte, mi chiedo?» Si voltò. «Proprio ora, Pipino, il cuore quasi mi ha ceduto, sentendo quel nome. Eppure in verità credo che le notizie portate da Faramir contengano qualche speranza. Perché sembra chiaro che il Nemico abbia finalmente aperto la sua guerra e fatto la prima mossa quando Frodo era ancora libero. Così ora per molti giorni terrà l&rsquo;occhio rivolto di qua e di là, lontano dalla sua terra. Eppure, Pipino, sento da lontano la sua fretta e la sua paura. Ha cominciato prima di quanto avrebbe voluto. È successo qualcosa che lo ha scosso.»</p></blockquote></details><figcaption class=quote-meta lang=en><span class=quote-who>— Gandalf</span>
<span class=quote-where>in J.R.R. Tolkien, <cite>Il ritorno del re</cite><span class=quote-kind>Book</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=en aria-pressed=true lang=en>English</button>
<button type=button class=quote-lang data-v=it aria-pressed=false lang=it>Italiano</button></p></figure><figure class=quote data-author=j.r.r.-tolkien data-kind=book data-lang=en><div class=quote-version lang=en data-v=en><blockquote class=quote-text><p>The world is changing: I feel it in the water, I feel it in the earth, and I smell it in the air.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Treebeard</span>
<span class=quote-where>in J.R.R. Tolkien, <cite>The Return of the King</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=it data-v=it hidden><blockquote class=quote-text><p>Il mondo sta cambiando: lo sento nell&rsquo;acqua, lo sento nella terra, e lo fiuto nell&rsquo;aria.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Treebeard</span>
<span class=quote-where>in J.R.R. Tolkien, <cite>Il ritorno del re</cite><span class=quote-kind>Book</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=en aria-pressed=true lang=en>English</button>
<button type=button class=quote-lang data-v=it aria-pressed=false lang=it>Italiano</button></p></figure><figure class=quote data-author=j.r.r.-tolkien data-kind=book data-lang=en><div class=quote-version lang=en data-v=en><blockquote class="quote-text quote-short"><p>“I have it!” he cried. “Of course, of course! Absurdly simple, like most riddles when you see the answer.” […] Mellon!</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>With a suddenness that startled them all the wizard sprang to his feet. He was laughing! “I have it!” he cried. “Of course, of course! Absurdly simple, like most riddles when you see the answer.”
Picking up his staff he stood before the rock and said in a clear voice: Mellon!
The star shone out briefly and faded again. Then silently a great doorway was outlined, though not a crack or joint had been visible before. Slowly it divided in the middle and swung outwards inch by inch, until both doors lay back against the wall.</p></blockquote></details><figcaption class=quote-meta lang=en><span class=quote-who>— Gandalf</span>
<span class=quote-where>in J.R.R. Tolkien, <cite>The Fellowship of the Ring</cite><span class=quote-kind>Book</span></span></figcaption></div><div class=quote-version lang=it data-v=it hidden><blockquote class="quote-text quote-short"><p>«Ci sono!» gridò. «Ma certo, ma certo! Assurdamente semplice, come la maggior parte degli indovinelli quando si conosce la risposta.» […] Mellon!</p></blockquote><details class=quote-more><summary lang=en><span class=when-closed>Read the full quote</span><span class=when-open>Show the short version</span></summary><blockquote class=quote-text><p>Con una rapidità che li fece sobbalzare tutti, lo stregone balzò in piedi. Rideva! «Ci sono!» gridò. «Ma certo, ma certo! Assurdamente semplice, come la maggior parte degli indovinelli quando si conosce la risposta.»
Raccolto il bastone, si fermò davanti alla roccia e disse con voce chiara: Mellon!
La stella brillò per un attimo e poi svanì di nuovo. Allora, in silenzio, si delineò un grande portale, benché prima non fosse visibile alcuna fessura né giuntura. Lentamente si divise nel mezzo e si aprì verso l&rsquo;esterno, pollice dopo pollice, finché i due battenti non furono accostati alla parete.</p></blockquote></details><figcaption class=quote-meta lang=en><span class=quote-who>— Gandalf</span>
<span class=quote-where>in J.R.R. Tolkien, <cite>La Compagnia dell'Anello</cite><span class=quote-kind>Book</span></span></figcaption></div><p class=quote-langs role=group aria-label=Language hidden><button type=button class=quote-lang data-v=en aria-pressed=true lang=en>English</button>
<button type=button class=quote-lang data-v=it aria-pressed=false lang=it>Italiano</button></p></figure><figure class=quote data-author=j.r.r.-tolkien data-kind=book data-lang=en><div class=quote-version lang=en data-v=en><blockquote class=quote-text><p>It is the deep breath before the plunge.</p></blockquote><figcaption class=quote-meta lang=en><span class=quote-who>— Gandalf</span>
